name: Build nds-bootstrap-ra

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  release:
    types: [created]
  workflow_dispatch:   # permite rodar manualmente: aba Actions > Run workflow

env:
  # Este projeto usa libnds 1.8.0 (nds/fifocommon.h, nds/fifomessages.h,
  # nds/arm7/clock.h, sec_t). O libnds 2.x removeu tudo isso, entao a imagem
  # "latest" NAO compila. Esta tag e a ultima conhecida com libnds 1.8.0.
  DEVKITARM_IMAGE: devkitpro/devkitarm:20241104

jobs:
  build:
    # Roda direto no runner Ubuntu (e NAO dentro de "container:"), de proposito.
    # Antes o job rodava dentro da imagem devkitarm e precisava de "apt-get install gcc p7zip"
    # numa imagem Debian 11 cujos repositorios ja nao servem pacotes (erro 404).
    # Agora o gcc do host compila o lzss e roda os testes; so o "make" roda no Docker.
    runs-on: ubuntu-latest
    name: Build with devkitARM (libnds 1.8.0)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Confere se os submodulos vieram
        run: |
          ls retail/cardenginei/arm9_ra/rcheevos/include/rc_runtime.h
          ls libs/dsiwifi | head -3

      - name: Compila o lzss (host, estatico)
        # Estatico para rodar dentro da imagem Debian 11 sem depender da glibc do host.
        run: gcc -O2 -static lzss.c -o lzss

      - name: Test the RA reader (host)
        run: ./tools/ra_reader_test.sh

      - name: Baixa a imagem do devkitARM
        run: docker pull "$DEVKITARM_IMAGE"

      - name: Build (nightly ou release) dentro do devkitARM
        env:
          TARGET: ${{ startsWith(github.ref, 'refs/tags') && 'package-release' || 'package-nightly' }}
        run: |
          docker run --rm -v "$PWD":/work -w /work "$DEVKITARM_IMAGE" bash -euxc '
            install -m 755 /work/lzss /usr/local/bin/lzss
            git config --global --add safe.directory "*"
            arm-none-eabi-gcc --version | head -1
            # serial de proposito: "make -j" tem corrida entre sub-makes
            make '"$TARGET"'
          '
          # os arquivos criados pelo container sao de root; libera para os passos seguintes
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Report cardengine space budget
        run: ./tools/ra_snapshot_addr.sh

      - name: Empacota (nightly)
        if: ${{ !startsWith(github.ref, 'refs/tags') }}
        run: |
          printf "${{ github.sha }}\n" >> bin/nightly-bootstrap.ver
          mv bin/ nds-bootstrap/
          mkdir -p ~/artifacts
          zip -r ~/artifacts/nds-bootstrap.zip nds-bootstrap/
          command -v 7z >/dev/null && 7z a ~/artifacts/nds-bootstrap.7z nds-bootstrap/ || true

      - name: Empacota (release)
        if: ${{ startsWith(github.ref, 'refs/tags') }}
        run: |
          printf "Release ${{ github.ref_name }}\n" >> bin/release-bootstrap.ver
          mkdir -p ~/artifacts
          (cd bin && zip -r ~/artifacts/nds-bootstrap.zip .)
          (cd bin && command -v 7z >/dev/null && 7z a ~/artifacts/nds-bootstrap.7z . || true)

      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: ~/artifacts/*
          name: build

      # Se falhar, guarda os logs/mapas para diagnostico
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-maps
          path: |
            **/*.map
          if-no-files-found: ignore

  # Only run this for non-PR jobs.
  publish_build:
    runs-on: ubuntu-latest
    name: Publish build
    if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: Upload to ${{ github.repository }} release
        run: |
          ID=$(jq --raw-output '.release.id' $GITHUB_EVENT_PATH)

          for file in ${{ github.workspace }}/build/*; do
            AUTH_HEADER="Authorization: token ${{ secrets.GITHUB_TOKEN }}"
            CONTENT_LENGTH="Content-Length: $(stat -c%s $file)"
            CONTENT_TYPE="Content-Type: application/7z-x-compressed"
            UPLOAD_URL="https://uploads.github.com/repos/${{ github.repository }}/releases/$ID/assets?name=$(basename $file)"

            curl -XPOST -H "$AUTH_HEADER" -H "$CONTENT_LENGTH" -H "$CONTENT_TYPE" --upload-file "$file" "$UPLOAD_URL"
          done
